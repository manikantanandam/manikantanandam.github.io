name: ATS badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r resume-builder/requirements.txt
      - name: Score committed PDFs
        run: python3 resume-builder/ats_check.py --min 0 --json-dir "$RUNNER_TEMP/badges"
      - name: Publish to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges && git switch badges
          else
            git switch --orphan badges
          fi
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP"/badges/*.json .
          git add ./*.json
          git diff --cached --quiet || { git commit -m "Update ATS badges"; git push origin badges; }
