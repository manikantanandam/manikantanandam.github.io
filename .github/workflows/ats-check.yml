name: ATS check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r resume-builder/requirements.txt
      - run: python3 resume-builder/build.py all
      - name: Generated site files must be up to date
        run: git diff --exit-code index.html sitemap.xml robots.txt
      - name: Fetch main's ATS scores (badges branch)
        run: git fetch --depth 1 origin badges && git show origin/badges:scores.json > "$RUNNER_TEMP/base.json" || echo "no baseline yet"
      - name: ATS score must not drop below main
        run: python3 resume-builder/ats_check.py --readme --baseline "$RUNNER_TEMP/base.json" --comment "$RUNNER_TEMP/comment.md"
      - name: Comment main vs PR scores (updates the previous comment)
        if: always() && hashFiles(format('{0}/comment.md', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --body-file "$RUNNER_TEMP/comment.md" 2>/dev/null \
          || gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file "$RUNNER_TEMP/comment.md"
      - name: README score table must be up to date
        run: git diff --exit-code README.md
