name: Build resume

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Resume variant to build
        type: choice
        options: [india, intl, de, all]
        default: intl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r resume/requirements.txt
      - run: python3 resume/build.py ${{ inputs.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: resume-${{ inputs.variant }}
          path: resume/dist/*.pdf
